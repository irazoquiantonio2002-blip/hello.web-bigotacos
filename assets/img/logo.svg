<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="bigotacosLogoTitle">
  <title id="bigotacosLogoTitle">Bigotacos</title>
  <defs>
    <linearGradient id="bgCircle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8371F"/>
      <stop offset="1" stop-color="#B21815"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#bgCircle)" stroke="#FFC72C" stroke-width="3"/>

  <!-- Taco shell -->
  <g transform="translate(60,66)">
    <path d="M -34 0 A 34 22 0 0 1 34 0 Z" fill="#FFC72C" stroke="#7A0F0F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -30 -1 A 30 19 0 0 1 30 -1" fill="none" stroke="#7A0F0F" stroke-width="1.4" opacity="0.35"/>
    <!-- lettuce -->
    <path d="M -30 -1 Q -22 -9 -14 -1 Q -6 -9 2 -1 Q 10 -9 18 -1 Q 26 -9 30 -1" fill="none" stroke="#3E8E3F" stroke-width="4" stroke-linecap="round"/>
    <!-- filling -->
    <rect x="-24" y="-3" width="48" height="5" rx="2.5" fill="#8C1A0F"/>
    <!-- tomato bits -->
    <circle cx="-14" cy="-1" r="2.4" fill="#E23B2E"/>
    <circle cx="4" cy="-2" r="2.4" fill="#E23B2E"/>
    <circle cx="18" cy="-1" r="2.4" fill="#E23B2E"/>
  </g>

  <!-- Mustache -->
  <g transform="translate(60,50)">
    <path d="M0 6
      C -4 -6 -16 -10 -24 -4
      C -30 0 -30 8 -22 10
      C -16 11.5 -10 6 -6 3
      C -3 1 -2 4 0 6
      C 2 4 3 1 6 3
      C 10 6 16 11.5 22 10
      C 30 8 30 0 24 -4
      C 16 -10 4 -6 0 6 Z"
      fill="#1A1210"/>
  </g>
</svg>
